<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Case workbench{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    table { border-collapse: collapse; }
    th, td { padding: 0.4rem 0.8rem; border-bottom: 1px solid #ddd; text-align: left; }
    td.number { text-align: right; }
    dl { display: grid; grid-template-columns: max-content auto; gap: 0.4rem 1.5rem; }
    dt { font-weight: 600; }
    .note { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">Case workbench</a>
    <p class="note">Simulated data for training. Every business and case is fictional.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
