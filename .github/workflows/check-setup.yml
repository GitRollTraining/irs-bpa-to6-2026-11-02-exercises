name: setup checks

on:
  push:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run .github/test_setup.py
      # A learner's check, as the README's step 5 runs it. CI has no Codex CLI, so a stand-in answers
      # its version and sign-in; the notebooks run with the course's own stand-ins.
      - name: Every cell of every notebook runs
        run: |
          git config --global user.name "Course check"
          git config --global user.email "course-check@example.invalid"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\n[ "$1" = --version ] && echo "codex-cli (CI stand-in)"\nexit 0\n' > "$RUNNER_TEMP/bin/codex"
          chmod +x "$RUNNER_TEMP/bin/codex"
          PATH="$RUNNER_TEMP/bin:$PATH" uv run check_setup.py
