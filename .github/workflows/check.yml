name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/check_repository.py
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked
      - run: uv run python .github/check_day_one.py
