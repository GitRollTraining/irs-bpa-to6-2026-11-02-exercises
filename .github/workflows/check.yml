name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .github/check_repository.py
      - run: python3 -m pip install -r requirements.txt
      - run: python3 .github/check_day_one.py
