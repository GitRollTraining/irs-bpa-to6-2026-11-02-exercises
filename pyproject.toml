# The course's Python environment. From the course folder, uv sync makes .venv from this file and
# uv.lock; uv run check_setup.py then checks the setup and runs every cell of every notebook.
[project]
name = "practice-exercises"
version = "0.1.0"
description = "The course's practice exercises: the day notebooks, their labs and their checks."
requires-python = ">=3.10"
dependencies = [
    "pytest==9.1.0",
    "jsonschema==4.26.0",
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[tool.uv]
package = false
